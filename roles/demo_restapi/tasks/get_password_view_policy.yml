---
# This task file has the following input/output parameter requirements.
# Input:
#   _capam_password_view_policy_name
# Output:
#   _capam_password_view_policy_id

- name: Get password view policy ID
  uri:
    url: "{{ capam_url }}/passwords/viewPolicies.json?sortBy=%2Bname&fields=id%2Cname%2Cdescription&name={{ _capam_password_view_policy_name | urlencode }}"
  module_defaults: "{{ capam_module_defaults }}"
  delegate_to: localhost
  register: _get_results

- name: Fail when no policy was returned
  fail:
    msg: "No records returned in CA PAM when searching with policy name: {{ _capam_password_view_policy_name }}"
  when: _get_results.json | length == 0

- name: Find the proper policy ID since GET operation searches by substring and not exact match
  set_fact:
    _capam_password_view_policy_item: "{{ _get_results.json | selectattr('name', 'equalto', _capam_password_view_policy_name) | list | default([]) }}"

- name: Fail when the exact policy name was not found in returned results
  fail:
    msg: "Exact policy name was not found in returned results from CA PAM when searching with policy name: {{ _capam_password_view_policy_name }}"
  when: _capam_password_view_policy_item | length == 0

- name: Get policy ID from matching policy
  set_fact:
    _capam_password_view_policy_id: "{{ _capam_password_view_policy_item[0]['id']  }}"

- debug: var=_capam_password_view_policy_id
