---
# This task file has the following input/output parameter requirements.
# Input:
#   _capam_password_composition_policy_name
# Output:
#   _capam_password_composition_policy_id

- name: Get password composition policy ID
  uri:
    url: "{{ capam_url }}/passwords/compositionPolicies.json?sortBy=%2Bname&fields=id%2Cname%2Cdescription&name={{ _capam_password_composition_policy_name }}"
  module_defaults: "{{ capam_module_defaults }}"
  delegate_to: localhost
  register: _get_results

- name: Show results from API call
  debug: var=_get_results

- name: Fail when more than one policy was returned
  fail:
    msg: "More than 1 record returned in CA PAM when searching with policy name: {{ _capam_password_view_policy_name }}"
  when: _get_results.json | length > 1

- name: Display and set password composition policy ID
  set_fact:
    _capam_password_composition_policy_id: "{{ _get_results.json[0].id }}"
